<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Login</title>
    <link rel="stylesheet" href="/css/login.css">

</head>

<body>
    <header>
        <a href="/html/index.html"><img src="/img/Toms logo nome transparente.png" alt="logo-site"></a>
        <nav>
            <ul>
                <a href="/html/agendamento.html">Agende aqui</a>
                <a href="/html/servicos.html">Serviços</a>
                <a href="/html/quem-somos.html">Sobre</a>
                <a href="/html/contato.html">Social</a>
            </ul>
        </nav>
        <div class="botoes-senha">
            <a href="/html/cadastro.html">Cadastra-se</a>
            <div>
                <a href="/html/login.html">Entrar</a>
            </div>
        </div>
    </header>
    <main>
        <section class="login-container">
            <form class="login-form">
                <div class="input-group">
                    <label for="username"></label>
                    <input type="text"
                     id="username" 
                     class="input-svg"
                     placeholder="Numero de Telefone" 
                     required>
                </div>

                <div class="input-group">
                    <label for="password"></label>
                    <input type="password" id="password" placeholder="Digite sua senha" required>
                </div>

                <button type="submit" class="login-btn">Entrar</button>
                <div class="options">
                    <label><input type="checkbox"> Lembrar de mim</label>
                    <a href="/">Esqueceu a senha?</a>
                </div>
                <div class="register-link">
                    Não tem uma conta? <a href="/html/cadastro.html"> Cadastre-se</a>
                </div>
            </form>
        </section>

    </main>
    <footer>
        <div class="servicos">
            <a href="/html/agendamento.html">Agende aqui</a>
            <a href="/html/servicos.html">Serviços</a>
            <a href="/html/quem-somos.html">Sobre</a>
            <a href="/html/contato.html">Social</a>
        </div>
        <div class="if-copy">
            <p>© 2026 IFPEGARANHUNS</p>
        </div>
    </footer>
</body>

</html>
