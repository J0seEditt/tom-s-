<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Agendamento</title>
    <link rel="stylesheet" href="../css/agendamento.css   ">

</head>

<body>
    <header>
        <a href="../html/index.html"><img src="../img/Toms logo nome transparente.png" alt="logo-site"></a>
        <nav>
            <ul>
                <a href="../html/agendamento.html">Agende aqui</a>
                <a href="../html/servicos.html">Serviços</a>
                <a href="../html/quem-somos.html">Sobre</a>
                <a href="../html/contato.html">Social</a>
            </ul>
        </nav>
        <div class="botoes-senha">
            <a href="../html/cadastro.html">Cadastra-se</a>
            <div>
                <a href="../html/login.html">Entrar</a>
            </div>
        </div>
    </header>
    <main>
        <div class="container-agendamento">
            <div class="container-calender">
                <!--Imagem provisoria ate puder usar biblioteca-->
                <img src="../img/Date&Time Picker.png" alt="calender-temporario">
            </div>
            <div class="container-servicos">
                <section>
                    <div class="opicoes-carros">
                        <select name="servicos-carros-list" id="servicos-carros-list">
                            <optgroup label="CARROS">
                                <option value="selcionar extra">EXTRAS
                                <option value="lavagem express carro">Lavagem Express - Carros</option>
                                <option value="lavagem premium carro">Lavagem Premium - Carros</option>
                                <option value="higienizacao interna carro">Higienização Interna - Carros</option>
                                <option value="tratamento vidros carro">Tratamento dos Vidros - Carros</option>
                                <option value="restauracao farois carro">Restauração dos Faróis - Carros</option>
                                <option value="polimento comercial carro">Polimento Comercial - Carros</option>
                                <option value="polimento tecnico carro">Polimento Técnico - Carros</option>
                                <option value="pacote stage1 carro">Pacote Stage I - Carros</option>
                                <option value="pacote stage2 carro">Pacote Stage II - Carros</option>
                                <option value="pacote stage3 carro">Pacote Stage III - Carros</option>
                            <optgroup label="MOTOS">
                                <option value="lavagem express moto">Lavagem Express - Motos</option>
                                <option value="lavagem premium moto">Lavagem Premium - Motos</option>
                                <option value="pacote stage1 moto">Pacote Stage I - Motos</option>
                                <option value="pacote stage2 moto">Pacote Stage II - Motos</option>
                        </select>
                    </div>
                    <div class="servicos-extra">
                        <select name="servicos-extra-list" id="servicos-extra-list">
                            <optgroup label="Extra">
                                <option value="selcionar_extra">EXTRAS
                                    <!-- Extras de Vidros e Visibilidade -->
                                <option value="remocao_chuva_acida">Remoção de Chuva Ácida</option>
                                <option value="cristalizacao_vidros">Cristalização dos Vidros (Melhora até 80% da
                                    visibilidade)</option>

                                <!-- Extras de Iluminação -->
                                <option value="restauracao_farois">Restauração dos Faróis (Remoção de amarelado e
                                    riscos)
                                </option>
                                <option value="vitrificacao_farois">Vitrificação de Faróis (Até 1 ano de proteção)
                                </option>

                                <!-- Extras de Interior -->
                                <option value="higienizacao ar condicionado">Higienização do Ar Condicionado</option>
                                <option value="detalhamento mala estepe">Detalhamento da Mala e Estepe</option>
                                <option value="sanitizacao bancos">Limpeza e Sanitização de Bancos</option>
                                <option value="condicionamento plasticos internos">Limpeza Profunda e Condicionamento de
                                    Plásticos Internos</option>

                                <!-- Extras de Exterior e Motor -->
                                <option value="enceramento pintura">Enceramento da Pintura</option>
                                <option value="descontaminacao pintura">Descontaminação da Pintura</option>
                                <option value="restauracao plasticos externos">Restauração de Plásticos Externos
                                </option>
                                <option value="protecao antioxidante motor">Proteção Antioxidante do Motor (Motos)
                                </option>
                                <option value="limpeza lubrificacao corrente">Limpeza e Lubrificação de Corrente (Motos)
                                </option>
                        </select>
                        <div class="resumo">
                            <div id="carrinho-servicos">
                                <span>RESUMO:</span>
                                <ul id="lista-selecionados">
                                    <!-- Os itens do Catalogo Tom`s aparecerão aqui, eu acho     -->
                                </ul>
                            </div>
                        </div>
                        <button type="submit" class="enviar-btn" id="btn-enviar-resumo">Enviar</button>
                    </div>
                </section>
            </div>
    </main>
    <footer>
        <div class="servicos">
            <a href="../html/agendamento.html">Agende aqui</a>
            <a href="../html/servicos.html">Serviços</a>
            <a href="../html/quem-somos.html">Sobre</a>
            <a href="../html/contato.html">Social</a>
        </div>
        <div class="if-copy">
            <p>©toms2026</p>
        </div>
    </footer>
    <script src="../js/agendamentos.js"></script>
</body>

</html>
